# /etc/nginx/conf.d/alyto.conf
# Backend API — api.alyto.app → localhost:3000

server {
    listen 80;
    server_name api.alyto.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.alyto.app;

    ssl_certificate     /etc/letsencrypt/live/api.alyto.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alyto.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Tamaño máximo upload (PDFs, comprobantes)
    client_max_body_size 10M;

    # Timeouts para WebSocket y SSE
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (ws/quote)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # SSE support (admin/events)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Health check sin logs
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
